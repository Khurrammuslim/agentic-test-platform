name: Nightly regression and agent drafts
on:
  #schedule:
  #- cron: '0 2 * * *' # turning off for demo
  workflow_dispatch:
jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=regression --project=generated
        continue-on-error: true
      - run: npm run kpi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-kpi
          path: |
            kpi.md
            playwright-report
